<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noway</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="landing-page" id="landingPage">

    <div class="computer-container" id="computerContainer">
      <img src="IMAGES/Logo on Screen 1.png" alt="Noway" class="landing-bg" id="computerImg">

      <!-- Idle video loops; click triggers Trim 1 then zoom -->
      <div class="screen-overlay" id="screenOverlay">
        <video class="screen-video" id="screenVideo" autoplay muted loop playsinline poster="IMAGES/nowayekraan.jpg">
          <source src="../noway%20web/uued%20asjad/nw_lcd_screen%20-%20Trim.mp4" type="video/mp4">
        </video>
        <!-- Preloaded: shown on click -->
        <video class="screen-video screen-video-hidden" id="screenVideoClick" muted playsinline preload="auto">
          <source src="../noway%20web/uued%20asjad/nw_lcd_screen%20-%20Trim%201.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <p class="hint-text" id="hintText">&#9654; click the screen</p>

  </div>

  <!-- Boot Sequence -->
  <div class="boot-overlay" id="bootOverlay">

    <!-- Windows XP loading screen -->
    <div id="bootXp">
      <div class="xp-logo">
        <div class="xp-flag">
          <div class="xp-tl"></div>
          <div class="xp-tr"></div>
          <div class="xp-bl"></div>
          <div class="xp-br"></div>
        </div>
        <div class="xp-wordmark">
          <span class="xp-microsoft">Microsoft</span>
          <span class="xp-name">Windows<em>XP</em></span>
        </div>
      </div>
      <div class="xp-bar-track">
        <div class="xp-pill"></div>
        <div class="xp-pill"></div>
        <div class="xp-pill"></div>
      </div>
      <span class="xp-copy">Copyright &copy; 2026 Noway Technologies. All rights reserved.</span>
    </div>

  </div>

  <!-- Page Transition -->
  <div class="page-transition" id="pageTransition"></div>

  <script src="script.js"></script>
</body>
</html>
